<!-- title: Meeting Bingo | A shareable bingo card of the phrases every meeting produces. -->
<h1>Meeting Bingo</h1>
<p class="sub">Click a phrase when you hear it. Five in a row wins. Share the link and your friends get the exact same card.</p>
<style>
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:460px;margin:0 auto}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12.5px;line-height:1.2;padding:4px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.cell.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.cell.win{outline:3px solid var(--ink)}
.banner{text-align:center;font-weight:800;font-size:22px;min-height:32px;margin-bottom:10px;color:var(--accent)}
</style>
<div class="grid">
<section class="card">
<div class="btns" style="margin-top:0"><button class="primary" id="newc">New card</button><button id="link">Copy link</button></div>
<label for="mine">Add your own phrases, one per line</label>
<textarea id="mine" rows="5" placeholder="Our CEO's favourite word&#10;The microphone echo"></textarea>
<div class="btns"><button id="usemine">Deal a card with mine</button></div>
<p class="note">Your own phrases are mixed into the pool. A shared link carries the card only, not your custom phrases, so send the link from a card that uses the standard pool.</p>
</section>
<section><div class="banner" id="banner"></div><div class="board" id="board"></div>
<div class="btns" style="justify-content:center"><button class="primary" id="png">Download image</button></div></section>
</div>
<!--@FOOT-->
<script>
/*@CARD*/
var P=["Let's circle back","Can you see my screen?","You're on mute","Let's take this offline","Sorry, I was on mute","Next slide please","Can everyone see this?","I have a hard stop","Let's put a pin in it","Quick question","Per my last email","Going forward","Low-hanging fruit","Moving the needle","Let's align on this","Bandwidth","Deep dive","Synergy","Touch base","At the end of the day","Does that make sense?","Sorry, go ahead","No, you go","Can you hear me?","Sorry, you cut out","Someone's dog barks","A kid walks in","Camera is off","Awkward silence","Who's taking notes?","We're out of time","Let me share my screen","Can you all see it now?","I'll send a follow-up","Let's take that async","Ping me after","Big picture","Pain points","Value add","Game changer","Double click on that","Unpack that","Leverage","Ecosystem","Circle the wagons","Run it up the flagpole","Boil the ocean","North star","Alignment","Stakeholders","Tiger team","Action items","Parking lot","Offline","Table that","Ideate","Pivot","Scalable","Best practice","Take a step back","I'm just going to jump in"];
var FREE="FREE: someone says 'you're on mute'";
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashSeed(s){var h=0;for(var i=0;i<s.length;i++)h=Math.imul(31,h)+s.charCodeAt(i)|0;return h}
var seed='',cells=[],on=[];
function deal(pool){
  var r=rng(hashSeed(seed)),a=pool.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
  cells=a.slice(0,24); cells.splice(12,0,FREE); on=cells.map(function(_,i){return i===12});
}
var LINES=[];for(var i=0;i<5;i++){LINES.push([0,1,2,3,4].map(function(c){return i*5+c}));LINES.push([0,1,2,3,4].map(function(r){return r*5+i}))}
LINES.push([0,6,12,18,24],[4,8,12,16,20]);
function winners(){return LINES.filter(function(l){return l.every(function(i){return on[i]})})}
function render(){
  var b=$('board'); b.textContent='';
  var w=winners(),wset={}; w.forEach(function(l){l.forEach(function(i){wset[i]=1})});
  cells.forEach(function(t,i){var d=document.createElement('button');d.className='cell'+(on[i]?' on':'')+(wset[i]?' win':'');d.textContent=t;d.addEventListener('click',function(){if(i===12)return;on[i]=!on[i];render()});b.appendChild(d)});
  $('banner').textContent=w.length?'BINGO!'+(w.length>1?' x'+w.length:''):'';
}
function newSeed(){seed=Math.random().toString(36).slice(2,8)}
function start(custom){
  if(!custom) try{history.replaceState(null,'','#'+seed)}catch(e){}
  var pool=P.slice(); if(custom) pool=pool.concat(custom);
  deal(pool); render();
}
function fromHash(){var h=location.hash.replace('#',''); if(h) seed=h; else newSeed(); start()}
function canvasBoard(){
  var W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;var g=c.getContext('2d');
  g.fillStyle='#fffdf8';g.fillRect(0,0,W,H);g.fillStyle='#1c1b19';g.font='800 72px '+Card.SANS;g.textAlign='center';g.fillText('MEETING BINGO',W/2,120);
  g.font='500 30px '+Card.SANS;g.fillStyle='#6f6a60';g.fillText(winners().length?'BINGO!':'Card '+seed,W/2,170);
  var s=190,gap=10,x0=(W-(5*s+4*gap))/2,y0=220;
  cells.forEach(function(t,i){
    var x=x0+(i%5)*(s+gap),y=y0+Math.floor(i/5)*(s+gap);
    g.fillStyle=on[i]?'#c2410c':'#ffffff';g.strokeStyle='#d9d3c5';g.lineWidth=2;g.beginPath();g.roundRect(x,y,s,s,14);g.fill();g.stroke();
    g.fillStyle=on[i]?'#ffffff':'#1c1b19';g.font=(on[i]?'700 ':'500 ')+'25px '+Card.SANS;
    var ls=Card.wrapText(g,t,s-24),yy=y+s/2-(ls.length-1)*15+8;ls.forEach(function(l,k){g.fillText(l,x+s/2,yy+k*30)});
  });
  g.fillStyle='#6f6a60';g.font='500 28px '+Card.SANS;g.fillText('Made with Meeting Bingo',W/2,H-50);
  return c;
}
$('newc').addEventListener('click',function(){newSeed();start()});
$('usemine').addEventListener('click',function(){newSeed();var c=$('mine').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);start(c)});
$('link').addEventListener('click',function(){Card.copy(location.href.split('#')[0]+'#'+seed,$('link'))});
$('png').addEventListener('click',function(){Card.download(canvasBoard(),'meeting-bingo.png')});
window.addEventListener('hashchange',fromHash);
fromHash();
</script>
