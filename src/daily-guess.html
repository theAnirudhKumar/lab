<!-- title: Daily Guess | Five daily guesses: three years and two distances. Same five for everyone. -->
<h1>Daily Guess</h1>
<p class="sub">Three "what year?" questions and two "how far?" questions, the same five for everyone each day. Get close and you score green. Share the grid.</p>
<style>
.g1{max-width:640px;margin:0 auto}
.q{font-size:clamp(20px,4vw,28px);font-weight:800;line-height:1.25;margin:6px 0 16px}
.prog{color:var(--mute);font-size:14px}
.big{font-size:34px;font-weight:800;text-align:center;margin:10px 0}
.res{font-size:38px;letter-spacing:4px;text-align:center;margin:10px 0}
.fb{text-align:center;margin-top:10px;min-height:48px}
</style>
<div class="g1"><section class="card" id="game"></section>
<div class="btns" style="justify-content:center"><button class="primary" id="share" style="display:none">Copy result</button><button id="png" style="display:none">Download image</button></div>
<p class="note" id="stats" style="text-align:center"></p></div>
<!--@FOOT-->
<script>
/*@CARD*/
var EV=[["The Berlin Wall falls",1989],["Apollo 11 lands the first people on the Moon",1969],["The Great Fire of London",1666],["Magna Carta is sealed",1215],["The storming of the Bastille",1789],["The Titanic sinks",1912],["The first iPhone goes on sale",2007],["The first website goes online",1991],["Columbus's first voyage across the Atlantic",1492],["The Battle of Hastings",1066],["The Chernobyl disaster",1986],["The Wright brothers' first powered flight",1903],["Victory in Europe Day ends the war in Europe",1945],["The US Declaration of Independence is adopted",1776],["Constantinople falls to the Ottomans",1453],["Krakatoa erupts",1883],["Alexander Fleming discovers penicillin",1928],["The Wall Street Crash",1929],["Nelson Mandela is released from prison",1990],["Euro notes and coins enter circulation",2002],["Google is founded",1998],["The Eiffel Tower is completed",1889],["Napoleon is defeated at Waterloo",1815],["India becomes independent",1947],["The Suez Canal opens",1869],["Sputnik 1 is launched",1957],["The first successful summit of Mount Everest",1953],["The first modern Olympic Games in Athens",1896],["The WHO declares COVID-19 a pandemic",2020],["Amazon is founded",1994],["The Panama Canal opens",1914],["The Mayflower sails to America",1620],["The Beatles appear on The Ed Sullivan Show",1964],["The Russian Revolution of October",1917],["Chandrayaan-3 lands near the Moon's south pole",2023]];
var CITY=[["London",51.51,-0.13],["Paris",48.86,2.35],["New York",40.71,-74.01],["Tokyo",35.68,139.69],["Sydney",-33.87,151.21],["Delhi",28.61,77.21],["Mumbai",19.08,72.88],["Cairo",30.04,31.24],["Cape Town",-33.92,18.42],["Rio de Janeiro",-22.91,-43.17],["Mexico City",19.43,-99.13],["Moscow",55.76,37.62],["Beijing",39.9,116.4],["Singapore",1.35,103.82],["Dubai",25.2,55.27],["Istanbul",41.01,28.98],["Los Angeles",34.05,-118.24],["Nairobi",-1.29,36.82],["Buenos Aires",-34.6,-58.38],["Reykjavik",64.15,-21.94],["Honolulu",21.31,-157.86],["Anchorage",61.22,-149.9],["Lima",-12.05,-77.04],["Toronto",43.65,-79.38],["Berlin",52.52,13.4],["Rome",41.9,12.5],["Bangkok",13.76,100.5],["Auckland",-36.85,174.76],["Lagos",6.52,3.38],["Santiago",-33.45,-70.67],["Seoul",37.57,126.98],["Jakarta",-6.21,106.85],["Kathmandu",27.72,85.32],["Lisbon",38.72,-9.14],["Vancouver",49.28,-123.12]];
function km(a,b){var R=6371,t=Math.PI/180,dl=(b[1]-a[1])*t,dg=(b[2]-a[2])*t,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a[1]*t)*Math.cos(b[1]*t)*Math.sin(dg/2)*Math.sin(dg/2);return Math.round(2*R*Math.asin(Math.sqrt(x)))}
var dayNo=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/DAY)-19000;
var r1=mulberry(dayNo*104729+5),ev=shuffled(EV,r1).slice(0,3),cs=shuffled(CITY,r1);
var Q=ev.map(function(e){return {k:'y',q:'In what year: '+e[0]+'?',a:e[1],min:1000,max:2026,def:1500}});
for(var i=0;i<2;i++){var A=cs[i*2],B=cs[i*2+1];Q.push({k:'d',q:'How far apart are '+A[0]+' and '+B[0]+', in a straight line?',a:km(A,B),def:5000})}
var key='dg-'+dayNo,st={g:[]},canvas=null;
try{var s0=localStorage.getItem(key);if(s0) st=JSON.parse(s0)}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}}
function band(q,g){
  if(q.k==='y'){var e=Math.abs(g-q.a);return e<=5?0:e<=25?1:e<=100?2:3}
  var r=Math.abs(g-q.a)/q.a;return r<=0.1?0:r<=0.25?1:r<=0.6?2:3;
}
var SQ=['🟩','🟨','🟧','🟥'];
function grid(){return st.g.map(function(g,i){return SQ[band(Q[i],g)]}).join('')}
function pts(){return st.g.reduce(function(s,g,i){return s+(3-band(Q[i],g))},0)}
function streak(){var n=0,d=dayNo;try{if(!localStorage.getItem('dg-'+d)) d--;while(localStorage.getItem('dg-'+d)&&JSON.parse(localStorage.getItem('dg-'+d)).g.length===5){n++;d--}}catch(e){}return n}
function shareText(){return 'Daily Guess #'+dayNo+' '+pts()+'/15\n'+grid()}
function logv(p){return Math.round(100*Math.exp(p/1000*Math.log(20000/100)))}
function draw(){
  var g=$('game');g.textContent='';var i=st.g.length;
  if(i>=5){
    var h=document.createElement('div');h.innerHTML='<div class="prog">Done for today</div><div class="q">'+pts()+' out of 15</div><div class="res">'+grid()+'</div>';
    Q.forEach(function(q,k){var p=document.createElement('div');p.className='prog';p.textContent=q.q.replace(/^In what year: /,'').replace(/\?$/,'')+' '+(q.k==='y'?'was '+q.a+'. You said '+st.g[k]:'is about '+q.a.toLocaleString('en-US')+' km. You said '+st.g[k].toLocaleString('en-US'));h.appendChild(p)});
    g.appendChild(h);$('share').style.display=$('png').style.display='inline-block';
    $('stats').textContent='Streak: '+streak()+' day'+(streak()===1?'':'s')+'. A new set arrives tomorrow.';
    canvas=Card.poster({kicker:'Daily Guess #'+dayNo,headline:pts()+' out of 15',sub:'Three years and two distances.',stats:[{v:st.g.length+' guesses',l:'Played'},{v:streak()+(streak()===1?' day':' days'),l:'Streak'}],footer:'Made with Daily Guess',hue:262});
    return;
  }
  var q=Q[i];
  g.innerHTML='<div class="prog">Question '+(i+1)+' of 5</div>';
  var qq=document.createElement('div');qq.className='q';qq.textContent=q.q;g.appendChild(qq);
  var v=document.createElement('div');v.className='big';g.appendChild(v);
  var sl=document.createElement('input');sl.type='range';sl.setAttribute('aria-label','Your guess');
  var cur;
  if(q.k==='y'){sl.min=q.min;sl.max=q.max;sl.value=q.def;cur=function(){return +sl.value};v.textContent=sl.value;sl.addEventListener('input',function(){v.textContent=sl.value})}
  else{sl.min=0;sl.max=1000;sl.value=500;cur=function(){return logv(+sl.value)};v.textContent=cur().toLocaleString('en-US')+' km';sl.addEventListener('input',function(){v.textContent=cur().toLocaleString('en-US')+' km'})}
  g.appendChild(sl);
  var b=document.createElement('button');b.className='primary';b.textContent='Lock it in';b.style.marginTop='14px';
  var fb=document.createElement('div');fb.className='fb';
  b.addEventListener('click',function(){
    var gv=cur(),bd=band(q,gv);b.disabled=true;sl.disabled=true;
    fb.textContent=SQ[bd]+' '+(q.k==='y'?'It was '+q.a:'It is about '+q.a.toLocaleString('en-US')+' km');
    st.g.push(gv);save();setTimeout(draw,1500);
  });
  g.appendChild(b);g.appendChild(fb);
}
$('share').addEventListener('click',function(){Card.copy(shareText(),$('share'))});
$('png').addEventListener('click',function(){if(canvas) Card.download(canvas,'daily-guess.png')});
draw();
</script>
