<!-- title: Dither Booth | Turn any photo into a thermal-receipt print, ASCII art, halftone or duotone poster. -->
<h1>Dither Booth</h1>
<p class="sub">Drop in a photo and get it printed on a receipt, as ASCII art, as halftone dots or as a two-colour poster. Your photo never leaves this page.</p>
<div class="grid">
<section class="card">
<div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a photo"><strong>Drop a photo here</strong><span>JPG, PNG or WebP. Or click to choose.</span><input id="file" type="file" accept="image/*" hidden></div>
<div class="btns"><button id="sample">Try with a sample picture</button></div><div class="err" id="err" role="alert"></div>
<label for="style">Style</label>
<select id="style"><option value="thermal">Thermal receipt</option><option value="ascii">ASCII art</option><option value="halftone">Halftone dots</option><option value="duotone">Duotone poster</option></select>
<label for="con">Contrast</label><input id="con" type="range" min="50" max="200" value="120">
<label for="det">Detail</label><input id="det" type="range" min="1" max="10" value="6">
<div class="row"><div><label for="c1">Ink or dark colour</label><input id="c1" type="color" value="#1c1b19"></div><div><label for="c2">Paper or light colour</label><input id="c2" type="color" value="#fffefa"></div></div>
<div class="chk"><input id="inv" type="checkbox"><label for="inv">Invert</label></div>
</section>
<section><div class="preview" id="out">Your print appears here.</div>
<div class="btns" style="justify-content:center"><button class="primary" id="png" disabled>Download image</button></div></section>
</div>
<!--@FOOT-->
<script>
/*@CARD*/
var img=null,canvas=null;
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function gray(src,w,h,con,inv){
  var c=document.createElement('canvas');c.width=w;c.height=h;var g=c.getContext('2d');g.drawImage(src,0,0,w,h);
  var d=g.getImageData(0,0,w,h).data,out=new Float32Array(w*h),k=con/100;
  for(var i=0;i<w*h;i++){var v=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]; v=(v-128)*k+128; v=Math.max(0,Math.min(255,v)); out[i]=inv?255-v:v}
  return out;
}
function dims(maxW){var r=img.height/img.width;return {w:maxW,h:Math.max(1,Math.round(maxW*r))}}
function thermal(){
  var det=+$('det').value,W=Math.round(120+det*30),D=dims(W),px=gray(img,D.w,D.h,+$('con').value,$('inv').checked);
  for(var y=0;y<D.h;y++)for(var x=0;x<D.w;x++){var i=y*D.w+x,o=px[i],n=o<128?0:255,e=o-n;px[i]=n;
    if(x+1<D.w)px[i+1]+=e*7/16; if(y+1<D.h){if(x>0)px[i+D.w-1]+=e*3/16;px[i+D.w]+=e*5/16;if(x+1<D.w)px[i+D.w+1]+=e/16}}
  var s=Math.max(2,Math.floor(440/D.w)),pad=30,hd=90,ft=120,w=D.w*s+pad*2,h=D.h*s+hd+ft,c=document.createElement('canvas');c.width=w;c.height=h;var g=c.getContext('2d');
  var ink=hex($('c1').value),paper=$('c2').value;g.fillStyle=paper;g.fillRect(0,0,w,h);
  g.fillStyle=$('c1').value;g.textAlign='center';g.font='700 28px '+Card.MONO;g.fillText('PHOTO RECEIPT',w/2,46);
  g.font='400 16px '+Card.MONO;g.fillText(new Date().toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}),w/2,72);
  for(y=0;y<D.h;y++)for(x=0;x<D.w;x++){if(px[y*D.w+x]===0)g.fillRect(pad+x*s,hd+y*s,s,s)}
  g.fillText('1 x YOU .......... PRICELESS',w/2,hd+D.h*s+44);g.fillText('THANK YOU, COME AGAIN',w/2,hd+D.h*s+74);
  return c;
}
function ascii(){
  var det=+$('det').value,cols=Math.round(40+det*12),ratio=0.5,D={w:cols,h:Math.max(1,Math.round(cols*(img.height/img.width)*ratio))},px=gray(img,D.w,D.h,+$('con').value,!$('inv').checked);
  var ramp=' .:-=+*#%@',fs=14,cw=fs*0.6,pad=24,w=Math.round(D.w*cw+pad*2),h=Math.round(D.h*fs*1.0+pad*2),c=document.createElement('canvas');c.width=w;c.height=h;var g=c.getContext('2d');
  g.fillStyle=$('c2').value;g.fillRect(0,0,w,h);g.fillStyle=$('c1').value;g.font='700 '+fs+'px '+Card.MONO;g.textBaseline='top';
  for(var y=0;y<D.h;y++){var s='';for(var x=0;x<D.w;x++){var v=px[y*D.w+x];s+=ramp[Math.min(9,Math.floor(v/25.6))]} g.fillText(s,pad,pad+y*fs)}
  return c;
}
function halftone(){
  var det=+$('det').value,cell=Math.max(4,22-det*2),W=Math.round(900/cell),D=dims(W),px=gray(img,D.w,D.h,+$('con').value,$('inv').checked),pad=30,w=D.w*cell+pad*2,h=D.h*cell+pad*2,c=document.createElement('canvas');c.width=w;c.height=h;var g=c.getContext('2d');
  g.fillStyle=$('c2').value;g.fillRect(0,0,w,h);g.fillStyle=$('c1').value;
  for(var y=0;y<D.h;y++)for(var x=0;x<D.w;x++){var r=(1-px[y*D.w+x]/255)*cell*0.55;if(r>0.4){g.beginPath();g.arc(pad+x*cell+cell/2,pad+y*cell+cell/2,r,0,7);g.fill()}}
  return c;
}
function duotone(){
  var W=Math.round(500+ +$('det').value*60),D=dims(W),px=gray(img,D.w,D.h,+$('con').value,$('inv').checked),a=hex($('c1').value),b=hex($('c2').value),c=document.createElement('canvas');c.width=D.w;c.height=D.h;var g=c.getContext('2d'),id=g.createImageData(D.w,D.h);
  for(var i=0;i<D.w*D.h;i++){var t=px[i]/255;for(var k=0;k<3;k++)id.data[i*4+k]=Math.round(a[k]+(b[k]-a[k])*t);id.data[i*4+3]=255}
  g.putImageData(id,0,0);return c;
}
function run(){
  if(!img) return; UI.err('');
  var s=$('style').value; canvas=({thermal:thermal,ascii:ascii,halftone:halftone,duotone:duotone})[s]();
  Card.show($('out'),canvas,520); $('png').disabled=false;
}
function setImg(i){img=i;run()}
function loadFile(files){
  var f=files[0]; if(!f) return;
  if(!/^image\//.test(f.type)){UI.err('That is not an image.');return}
  var u=URL.createObjectURL(f),i=new Image();i.onload=function(){setImg(i)};i.onerror=function(){UI.err('Could not open that image.')};i.src=u;
}
function sample(){
  var c=document.createElement('canvas');c.width=600;c.height=600;var g=c.getContext('2d');
  var gr=g.createRadialGradient(300,260,20,300,300,330);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#222');g.fillStyle=gr;g.fillRect(0,0,600,600);
  g.fillStyle='#777';g.beginPath();g.arc(300,250,130,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(255,230,18,0,7);g.arc(345,230,18,0,7);g.fill();
  g.strokeStyle='#111';g.lineWidth=14;g.beginPath();g.arc(300,280,70,0.15*Math.PI,0.85*Math.PI);g.stroke();
  g.fillStyle='#ddd';g.fillRect(150,430,300,170);
  setImg(c);
}
UI.dropzone('drop','file',loadFile,false);
$('sample').addEventListener('click',sample);
['style','con','det','c1','c2','inv'].forEach(function(id){$(id).addEventListener('input',run)});
$('style').addEventListener('change',function(){var s=$('style').value; if(s==='duotone'){$('c1').value='#1d2a6b';$('c2').value='#ffd166'} else if(s==='halftone'){$('c1').value='#c2410c';$('c2').value='#fff7ed'} else {$('c1').value='#1c1b19';$('c2').value='#fffefa'} run()});
$('png').addEventListener('click',function(){if(canvas) Card.download(canvas,'dither-booth.png')});
</script>
